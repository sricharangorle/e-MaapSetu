services:
  - type: web
    name: e-maapsetu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
